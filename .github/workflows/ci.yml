name: CI

# Runs the automated tests on every push to main and on every pull request.
#
# Safety: everything here uses a THROWAWAY PostgreSQL container that exists only for the duration of the job, with a
# made-up user and password that protect nothing. No production credential is read, no repository secret is used, and no
# persistent database or Docker volume is touched. The service test suites create their own `impex_*_test` database, build it
# from the Alembic migrations, and drop it again.
#
# The live end-to-end scripts (scripts/verify_*.py) drive the running Docker stack and are intentionally NOT run here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, organization-service, inventory-service, sales-service, purchasing-service, support-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-only-throwaway-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: ci_user
      DB_PASSWORD: ci-only-throwaway-password
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the tests (they also check that the models match the migrations)
        run: python -m pytest -q

  frontend:
    name: dashboard (Organization Portal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Run the tests
        run: npx vitest run
      - name: Production build (also type-checks the tests)
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  super-admin:
    name: super-admin (Super Admin Portal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/super-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Run the tests (Support Inbox, role separation, administrators)
        run: npx vitest run
      - name: Production build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
