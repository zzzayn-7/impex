# The AWS production overlay:   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
# (infra/terraform/modules/server/files/deploy.sh does exactly that.)
#
# Local development publishes every service's port on the machine. On the server NOTHING is published except the edge: the services, the portals and the nginx gateway
# live on the private Docker network only. The edge (gateway/Caddyfile.aws) is HTTPS plus a password in front of the two portals. PostgreSQL stays bound to localhost.
# `!reset` needs Docker Compose 2.24 or newer (the server installs 2.29).
services:
  gateway:
    ports: !reset []
  auth-service:
    ports: !reset []
  organization-service:
    ports: !reset []
  inventory-service:
    ports: !reset []
  sales-service:
    ports: !reset []
  purchasing-service:
    ports: !reset []
  support-service:
    ports: !reset []
  finance-service:
    ports: !reset []
  super-admin:
    ports: !reset []
  dashboard:
    ports: !reset []

  # Mailpit is the platform's mail server here: every e-mail the platform sends (invitations, support) is CAUGHT, not delivered, and read in its web page
  # (https://mail.<domain>, behind the front-door password). Nothing reaches a real inbox: copy a link out of the message and pass it on yourself.
  # Messages are kept on disk, so they survive restarts.
  mailpit:
    profiles: !reset []
    ports: !reset []
    environment:
      - MP_DATABASE=/data/mailpit.db
      - MP_MAX_MESSAGES=5000
    volumes:
      - mailpit_data:/data

  edge:
    image: caddy:2-alpine
    container_name: impex-edge
    restart: unless-stopped
    ports:
      - "80:80" # Let's Encrypt validation and the redirect to https
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN must be set}
      - EDGE_USER=${EDGE_USER:?EDGE_USER must be set}
      - EDGE_PASSWORD_HASH=${EDGE_PASSWORD_HASH:?EDGE_PASSWORD_HASH must be set}
    volumes:
      - ./gateway/Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - super-admin
      - dashboard
      - mailpit
    networks:
      - impex-network

volumes:
  mailpit_data:
