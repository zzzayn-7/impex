services:
  gateway:
    image: nginx:alpine
    container_name: impex-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - organization-service
      - super-admin
    networks:
      - impex-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: impex-auth-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=${AUTH_SECRET_KEY:-default_dev_secret_key_change_me}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${AUTH_DB_NAME:-impex_auth}
      - DB_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - INTERNAL_API_KEY=${AUTH_INTERNAL_API_KEY:?AUTH_INTERNAL_API_KEY must be set in .env}
      - DEMO_MODE=${DEMO_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - impex-network

  organization-service:
    build:
      context: ./services/organization-service
      dockerfile: Dockerfile
    container_name: impex-organization-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${ORG_DB_NAME:-impex_organizations}
      - DB_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - AUTH_SERVICE_URL=http://auth-service:8000
      - LOGO_STORAGE_DIR=/data/logos
      - LOGO_MAX_BYTES=${LOGO_MAX_BYTES:-2097152}
      - TENANT_PORTAL_URL=${TENANT_PORTAL_URL:-http://localhost:3001}
      - DEMO_MODE=${DEMO_MODE:-false}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:-12345678}
      - AUTH_INTERNAL_API_KEY=${AUTH_INTERNAL_API_KEY:?AUTH_INTERNAL_API_KEY must be set in .env}
      # Module management: before a module is switched off, this service asks Purchasing and Sales what is in progress for the organization.
      # The shared secret defaults to the existing internal key; set MODULE_INTERNAL_API_KEY in .env to use a separate one.
      - MODULE_INTERNAL_API_KEY=${MODULE_INTERNAL_API_KEY:-${AUTH_INTERNAL_API_KEY}}
      - PURCHASING_SERVICE_URL=http://purchasing-service:8004
      - SALES_SERVICE_URL=http://sales-service:8003
      - ACTIVATION_API_KEY=${ORG_ACTIVATION_API_KEY:?ORG_ACTIVATION_API_KEY must be set in .env}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      - SMTP_SSL=${SMTP_SSL:-false}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-no-reply@impex.local}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Impex}
    volumes:
      - org-logos:/data/logos  # uploaded company logos: persistent (removed only by `docker compose down -v`)
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
        required: false  # only a local mail catcher; not needed when SMTP_HOST points at a real server
    networks:
      - impex-network

  super-admin:
    build:
      context: ./frontend/super-admin
      dockerfile: Dockerfile
    container_name: impex-super-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_GATEWAY_URL=${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost}
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ORG_SERVICE_URL=http://organization-service:8001
      - ORG_ACTIVATION_API_KEY=${ORG_ACTIVATION_API_KEY:?ORG_ACTIVATION_API_KEY must be set in .env}
      - SUPPORT_SERVICE_URL=http://support-service:8005
      - TENANT_PORTAL_URL=${TENANT_PORTAL_URL:-http://localhost:3001}
      - DEMO_MODE=${DEMO_MODE:-false}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:-12345678}
    networks:
      - impex-network

  # Product catalog (tenant-scoped). Own database: impex_inventory.
  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: impex-inventory-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${INVENTORY_DB_NAME:-impex_inventory}
      - DB_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ORG_SERVICE_URL=http://organization-service:8001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - impex-network

  # Clients and delivery lists (tenant-scoped). Own database: impex_sales. Reads products/stock from the Inventory Service
  # with the caller's own token; never changes inventory.
  sales-service:
    build:
      context: ./services/sales-service
      dockerfile: Dockerfile
    container_name: impex-sales-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${SALES_DB_NAME:-impex_sales}
      - DB_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ORG_SERVICE_URL=http://organization-service:8001
      - MODULE_INTERNAL_API_KEY=${MODULE_INTERNAL_API_KEY:-${AUTH_INTERNAL_API_KEY}}  # lets the Organization Service ask what is in progress before a module is switched off
      - INVENTORY_SERVICE_URL=http://inventory-service:8002
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - impex-network

  # Suppliers and purchase orders (tenant-scoped). Own database: impex_purchasing. Reads products from the Inventory Service
  # with the caller's own token; never changes inventory (receiving goods is a later step).
  purchasing-service:
    build:
      context: ./services/purchasing-service
      dockerfile: Dockerfile
    container_name: impex-purchasing-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${PURCHASING_DB_NAME:-impex_purchasing}
      - DB_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ORG_SERVICE_URL=http://organization-service:8001
      - MODULE_INTERNAL_API_KEY=${MODULE_INTERNAL_API_KEY:-${AUTH_INTERNAL_API_KEY}}  # lets the Organization Service ask what is in progress before a module is switched off
      - INVENTORY_SERVICE_URL=http://inventory-service:8002
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - impex-network

  # Help & Support tickets and the durable email outbox. Own database: impex_support. Organization administrators open and follow tickets;
  # the Super Admin answers them from the Super Admin portal. Email is only a notification (SUPPORT_NOTIFICATION_EMAIL receives the alerts).
  support-service:
    build:
      context: ./services/support-service
      dockerfile: Dockerfile
    container_name: impex-support-service
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${SUPPORT_DB_NAME:-impex_support}
      - DB_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ORG_SERVICE_URL=http://organization-service:8001
      - SUPPORT_NOTIFICATION_EMAIL=${SUPPORT_NOTIFICATION_EMAIL:-}
      - SUPER_ADMIN_PORTAL_URL=${SUPER_ADMIN_PORTAL_URL:-http://localhost:3000}
      - TENANT_PORTAL_URL=${TENANT_PORTAL_URL:-http://localhost:3001}
      - SUPPORT_OUTBOX_INTERVAL_SECONDS=${SUPPORT_OUTBOX_INTERVAL_SECONDS:-5}
      - SUPPORT_OUTBOX_RETRY_BASE_SECONDS=${SUPPORT_OUTBOX_RETRY_BASE_SECONDS:-30}
      - SUPPORT_OUTBOX_MAX_ATTEMPTS=${SUPPORT_OUTBOX_MAX_ATTEMPTS:-8}
      - SUPPORT_TICKETS_PER_HOUR=${SUPPORT_TICKETS_PER_HOUR:-10}
      - SUPPORT_MESSAGES_PER_10_MIN=${SUPPORT_MESSAGES_PER_10_MIN:-30}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      - SMTP_SSL=${SMTP_SSL:-false}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-no-reply@impex.local}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Impex}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
        required: false  # only a local mail catcher; not needed when SMTP_HOST points at a real server
    networks:
      - impex-network

  # Chart of accounts, double-entry journal and expenses. Own database: impex_finance. Off for every organization until the Super Admin
  # enables the Finance module. A background worker PULLS issued invoices, payments and confirmed goods receipts from the Sales and
  # Purchasing services (read-only feeds, shared secret) and posts each exactly once. It never changes a Sales/Purchasing/Inventory record.
  finance-service:
    build:
      context: ./services/finance-service
      dockerfile: Dockerfile
    container_name: impex-finance-service
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      - PORT=8006
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${FINANCE_DB_NAME:-impex_finance}
      - DB_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ORG_SERVICE_URL=http://organization-service:8001
      - SALES_SERVICE_URL=http://sales-service:8003
      - PURCHASING_SERVICE_URL=http://purchasing-service:8004
      - MODULE_INTERNAL_API_KEY=${MODULE_INTERNAL_API_KEY:-${AUTH_INTERNAL_API_KEY}}  # reads the Sales/Purchasing feeds and each organization's entitlements
      - FINANCE_SYNC_ENABLED=${FINANCE_SYNC_ENABLED:-true}
      - FINANCE_SYNC_INTERVAL_SECONDS=${FINANCE_SYNC_INTERVAL_SECONDS:-15}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - impex-network

  # Organization administrator portal (separate app, separate session cookie from the Super Admin portal)
  dashboard:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
    container_name: impex-dashboard
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ORG_SERVICE_URL=http://organization-service:8001
      - INVENTORY_SERVICE_URL=http://inventory-service:8002
      - SALES_SERVICE_URL=http://sales-service:8003
      - PURCHASING_SERVICE_URL=http://purchasing-service:8004
      - SUPPORT_SERVICE_URL=http://support-service:8005
      - FINANCE_SERVICE_URL=http://finance-service:8006
    depends_on:
      - auth-service
    networks:
      - impex-network

  # OPTIONAL local mail catcher (not started by default; real SMTP from .env is used instead).
  # To use it: set SMTP_HOST=mailpit, SMTP_PORT=1025, SMTP_STARTTLS=false in .env, then run
  #   docker compose --profile mailpit up -d mailpit      (inbox: http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: impex-mailpit
    profiles: ["mailpit"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - impex-network

  postgres:
    image: postgres:16-alpine
    container_name: impex-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d impex_auth -c 'SELECT 1' && psql -U $${POSTGRES_USER} -d impex_organizations -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - impex-network

  # OPTIONAL local HTTPS for phone camera scanning (not started by default). Browsers only allow camera access on
  # https:// pages, so a phone on the same Wi-Fi cannot scan from http://192.168.x.x:3001. See docs/scanning.md.
  #   docker compose --profile https up -d https-proxy      (portal at https://<LAN IP>:3443)
  https-proxy:
    image: caddy:2-alpine
    container_name: impex-https-proxy
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "3443:3443"
    environment:
      # The address a phone will type (python scripts/lan_ip.py prints it). Set it in .env as LAN_HOST=192.168.x.x
      - LAN_HOST=${LAN_HOST:-127.0.0.1}
    volumes:
      - ./gateway/Caddyfile.https:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - dashboard
    networks:
      - impex-network

volumes:
  postgres_data:
  caddy_data:
  org-logos:  # uploaded company logos (Organization Service)

networks:
  impex-network:
    driver: bridge

